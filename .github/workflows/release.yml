name: release

on:
  push:
    tags: ["v*"]

# contents: write uploads the draft release; id-token: write lets cosign obtain
# the workflow's OIDC identity for keyless signing and lets the attest action
# sign the provenance; attestations: write stores it. Nothing else.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install syft (one SBOM per archive)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install cosign (public repository only)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Build, sign (public repository only) and upload the draft
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          # Signing and attestation run only when the repository's visibility
          # is 'public'. Any other value, including a missing field, skips both
          # (fail closed): the Sigstore log is public and would name this
          # repository and workflow, and attestations on a private repository
          # need GitHub Enterprise Cloud.
          args: release --clean ${{ github.event.repository.visibility != 'public' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance (public repository only)
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Summary
        if: always()
        env:
          VISIBILITY: ${{ github.event.repository.visibility }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Release $TAG"
            if [ "$VISIBILITY" != "public" ]; then
              echo "Repository visibility is '$VISIBILITY' (not public): UNSIGNED draft, no attestation. Nothing reached Sigstore or the attestation store."
            else
              echo "Signed: cosign bundle checksums.txt.sigstore.json; provenance attested for every file in checksums.txt."
              echo
              echo 'Verify (paste into the release notes):'
              echo '```sh'
              echo "cosign verify-blob --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}' --certificate-oidc-issuer https://token.actions.githubusercontent.com --bundle checksums.txt.sigstore.json checksums.txt"
              echo "gh attestation verify watchdeck_<version>_<os>_<arch>.tar.gz --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
              echo '```'
            fi
            echo
            echo '```'
            cat dist/checksums.txt 2>/dev/null || echo "(no checksums.txt: the build failed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
