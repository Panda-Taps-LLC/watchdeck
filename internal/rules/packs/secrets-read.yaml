pack: secrets-read
version: 1
description: >-
  Reads of well-known credential files: SSH private keys, AWS credentials,
  .env files, ~/.netrc, cloud CLI credentials, and macOS keychain dumps.
rules:
  - id: ssh-private-key
    tool: Bash
    match:
      literals: [".ssh/"]
      argv0: [cat, less, more, head, tail, bat, batcat, nl, tac, xxd, hexdump, od, strings, base64, grep, egrep, fgrep, rg, awk, sed, cp, mv]
      regex: '[\s''"=:<](?:(?:~|\$HOME|\$\{HOME\}|/Users/[^/\s''"]+|/home/[^/\s''"]+|/root)/)?\.ssh/(?:id_[A-Za-z0-9_*-]+|\*)(?:[^.A-Za-z0-9_*-]|$)'
    severity: critical
    action: ask
    description: A command reads or copies an SSH private key (~/.ssh/id_*).
    fp_note: >-
      Public keys (id_*.pub), ~/.ssh/config, ssh -i and ssh-keygen do not
      match, and nor do key-shaped paths inside a project
      (testdata/home/.ssh/id_fake), because the path must start at a home
      prefix or a bare .ssh/. No agent task needs a private key's bytes; a
      person who does can run the command themselves; ask until the owner reviews the packs (log/ask only).

  - id: aws-credentials
    tool: Bash
    match:
      literals: [".aws/credentials"]
      argv0: [cat, less, more, head, tail, bat, batcat, nl, tac, xxd, hexdump, od, strings, base64, grep, egrep, fgrep, rg, awk, sed, cp, mv]
      regex: '[\s''"=:<](?:(?:~|\$HOME|\$\{HOME\}|/Users/[^/\s''"]+|/home/[^/\s''"]+|/root)/)?\.aws/credentials(?:[^A-Za-z0-9_.-]|$)'
    severity: critical
    action: ask
    description: A command reads or copies ~/.aws/credentials.
    fp_note: >-
      ~/.aws/config and the aws CLI itself do not match. The file holds
      long-lived secret keys and the CLI reads it on its own; an agent never
      needs to print it; ask until the owner reviews the packs.

  - id: dotenv
    tool: Bash
    match:
      literals: [".env"]
      argv0: [cat, less, more, head, tail, bat, batcat, nl, xxd, strings, base64, grep, egrep, rg, awk]
      regex: '[\s''"=:</]\.env(?:\.(?:local|production|prod|development|dev|staging|test))?(?:[\s''"]|$)'
    severity: medium
    action: log
    description: A command prints a .env file (but not .env.example or .env.sample).
    fp_note: >-
      Developers grep and cat their own .env to debug configuration all the
      time, so this only logs. .env.example, .env.sample, .env.template and
      .envrc do not match; `cp .env.example .env` does not match because cp is
      not in argv0.

  - id: netrc
    tool: Bash
    match:
      literals: [".netrc"]
      argv0: [cat, less, more, head, tail, bat, batcat, nl, xxd, strings, base64, grep, egrep, rg, awk, sed, cp, mv]
      regex: '[\s''"=:<](?:(?:~|\$HOME|\$\{HOME\}|/Users/[^/\s''"]+|/home/[^/\s''"]+|/root)/)?\.netrc(?:[\s''"]|$)'
    severity: high
    action: log
    description: A command reads ~/.netrc (machine passwords and API tokens).
    fp_note: >-
      New rule, logs for one release. Checking whether an entry exists
      (grep machine ~/.netrc) is a plausible honest use.

  - id: cloud-credentials
    tool: Bash
    match:
      literals: ["gcloud", ".kube/config", ".docker/config.json", "gh/hosts.yml", ".azure/"]
      argv0: [cat, less, more, head, tail, bat, batcat, nl, xxd, strings, base64, grep, egrep, rg, awk, sed, cp, mv, tar, zip]
      regex: '[\s''"=:<](?:(?:~|\$HOME|\$\{HOME\}|/Users/[^/\s''"]+|/home/[^/\s''"]+|/root)/)?\.(?:config/gcloud(?:/|[\s''"]|$)|kube/config\b|docker/config\.json\b|config/gh/hosts\.yml\b|azure/)'
    severity: high
    action: log
    description: A command reads cloud CLI credentials (gcloud, kubeconfig, docker, gh, azure).
    fp_note: >-
      New rule, logs for one release. Inspecting a kubeconfig context or the
      docker credential helper setting is a common honest read.

  - id: keychain-dump
    tool: Bash
    match:
      argv0: [security]
      regex: '\s(?:find-(?:generic|internet)-password\b[^|;&\n]*\s-[a-zA-Z]*[wg](?:\s|$)|dump-keychain\b)'
    severity: high
    action: log
    description: A command prints a password from the macOS keychain (security find-*-password -w/-g, dump-keychain).
    fp_note: >-
      New rule, logs for one release. Scripts legitimately fetch their own
      API token from the keychain with `security find-generic-password -w`.

  - id: read-ssh-private-key
    tool: Read
    match:
      literals: ["/.ssh/id_"]
      regex: '^(?:~|/Users/[^/]+|/home/[^/]+|/root|/var/root)/\.ssh/id_[A-Za-z0-9_-]+$'
    severity: critical
    action: ask
    description: The Read tool opens an SSH private key in the home directory.
    fp_note: >-
      Same reasoning as ssh-private-key: only a home-level ~/.ssh/id_* without
      .pub matches, and no agent task needs the key's bytes.

  - id: read-aws-credentials
    tool: Read
    match:
      literals: ["/.aws/credentials"]
      regex: '^(?:~|/Users/[^/]+|/home/[^/]+|/root|/var/root)/\.aws/credentials$'
    severity: critical
    action: ask
    description: The Read tool opens ~/.aws/credentials.
    fp_note: Same reasoning as aws-credentials; ~/.aws/config does not match.

  - id: read-dotenv
    tool: Read
    match:
      literals: [".env"]
      regex: '(?:^|/)\.env(?:\.(?:local|production|prod|development|dev|staging|test))?$'
    severity: medium
    action: log
    description: The Read tool opens a .env file (not .env.example).
    fp_note: Agents read a project's .env to debug configuration; log only.

  - id: read-other-credentials
    tool: Read
    match:
      literals: [".netrc", "gcloud", ".kube/config", ".docker/config.json", "hosts.yml"]
      regex: '^(?:~|/Users/[^/]+|/home/[^/]+|/root)/\.(?:netrc|config/gcloud/.+|kube/config|docker/config\.json|config/gh/hosts\.yml)$'
    severity: high
    action: log
    description: The Read tool opens ~/.netrc or cloud CLI credentials.
    fp_note: New rule, logs for one release; see netrc and cloud-credentials.
